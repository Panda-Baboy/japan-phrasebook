<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Japan Phrasebook — Sample</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#202633;background:#f7f7f4}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:16px;z-index:2}main{max-width:700px;margin:auto;padding:18px}h1{font-size:23px;margin:0 0 6px}h2{font-size:21px}p{line-height:1.5}.muted{color:#666;font-size:14px}.card,button.category{background:white;border:1px solid #e2e2e2;border-radius:14px;padding:16px;margin:10px 0;width:100%;text-align:left}.category{font-size:17px;font-weight:650;cursor:pointer}button{font:inherit;cursor:pointer}.back{border:0;background:none;color:#205a88;padding:12px 0}input{width:100%;padding:13px;border:1px solid #ccc;border-radius:12px;font-size:16px}.jp{font-size:21px;font-weight:650;margin:10px 0 5px}.kana{font-size:16px}.romaji{color:#666;font-style:italic;margin:6px 0}.english{font-weight:600}.copy{border:1px solid #bbb;border-radius:9px;background:#fff;padding:9px 12px;margin-top:8px}details{background:white;border:1px solid #ddd;border-radius:12px;padding:14px;margin:10px 0}summary{font-weight:650;cursor:pointer}.hide{display:none}.tag{font-size:12px;color:#666}footer{padding:20px;text-align:center;color:#666}</style></head><body><header><h1>🇯🇵 Japan Phrasebook <span class="tag">SAMPLE</span></h1><div class="muted">Ueno · Umeda · Kyoto · Nara</div></header><main><section id="home"><p>Tap a topic or search in English, Japanese, or romaji. Everything in this sample works offline.</p><input id="search" placeholder="Search: matcha, luggage, futari…" aria-label="Search phrases"><div id="results"></div><div id="categories"></div></section><section id="detail" class="hide"><button class="back" onclick="goHome()">← All categories</button><h2 id="heading"></h2><div id="phrases"></div><details><summary>What staff might say</summary><div id="staff"></div></details><button class="back" onclick="goHome()">↑ Back to contents</button></section></main><footer>Preview only · We'll keep adding to the full guide 💕</footer><script>
const data=[{name:'🍵 Matcha & Coffee',phrases:[['アイス抹茶ラテを二つお願いします。','アイスまっちゃラテを ふたつ おねがいします。','Aisu matcha rate o futatsu onegaishimasu.','Two iced matcha lattes, please.'],['砂糖なしでお願いします。','さとうなしで おねがいします。','Satou nashi de onegaishimasu.','No sugar, please.']],staff:[['ホットとアイス、どちらになさいますか？','ホットと アイス、どちらに なさいますか？','Hotto to aisu, dochira ni nasaimasu ka?','Hot or iced?']]},{name:'🧳 Luggage Storage',phrases:[['チェックアウト後に荷物を預けられますか？','チェックアウトごに にもつを あずけられますか？','Chekkuauto-go ni nimotsu o azukeraremasu ka?','Can we store luggage after checkout?'],['夕方まで預かっていただけますか？','ゆうがたまで あずかっていただけますか？','Yuugata made azukatte itadakemasu ka?','Could you keep it until the evening?']],staff:[['何時ごろお戻りですか？','なんじごろ おもどりですか？','Nanji goro omodori desu ka?','Around what time will you return?']]},{name:'🍡 Tsukiji Street Food',phrases:[['これを四つお願いします。','これを よっつ おねがいします。','Kore o yottsu onegaishimasu.','Four of these, please.'],['ここで食べてもいいですか？','ここで たべても いいですか？','Koko de tabete mo ii desu ka?','Can we eat here?']],staff:[['こちらでお召し上がりください。','こちらで おめしあがりください。','Kochira de omeshiagari kudasai.','Please eat here.']]},{name:'🚄 Shinkansen',phrases:[['新幹線の乗り場はどこですか？','しんかんせんの のりばは どこですか？','Shinkansen no noriba wa doko desu ka?','Where is the Shinkansen boarding area?']],staff:[['こちらでお乗り換えください。','こちらで おのりかえください。','Kochira de onorikae kudasai.','Please transfer here.']]},{name:'🔢 Numbers & People',phrases:[['一人です。','ひとりです。','Hitori desu.','One person.'],['二人です。','ふたりです。','Futari desu.','Two people.'],['四人です。','よにんです。','Yonin desu.','Four people.']],staff:[['何名様ですか？','なんめいさまですか？','Nanmei-sama desu ka?','How many people?']]},{name:'🃏 One Piece TCG',phrases:[['このカードの在庫はありますか？','この カードの ざいこは ありますか？','Kono kaado no zaiko wa arimasu ka?','Do you have this card in stock?']],staff:[['こちらは傷あり商品です。','こちらは きずありしょうひんです。','Kochira wa kizu ari shouhin desu.','This item has damage.']]}];
function card(p){const div=document.createElement('article');div.className='card';const english=document.createElement('div');english.className='english';english.textContent=p[3];div.append(english);for(const [cls,value] of [['jp',p[0]],['kana',p[1]],['romaji',p[2]]]){const el=document.createElement('div');el.className=cls;el.textContent=value;div.append(el)}const b=document.createElement('button');b.className='copy';b.textContent='Copy Japanese';b.onclick=()=>{if(navigator.clipboard?.writeText){navigator.clipboard.writeText(p[0]).then(()=>b.textContent='Copied!').catch(()=>fallbackCopy(p[0],b))}else fallbackCopy(p[0],b)};div.append(b);return div}function fallbackCopy(t,b){const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();try{document.execCommand('copy');b.textContent='Copied!'}catch(e){b.textContent='Select Japanese text above'}a.remove()}function openTopic(i){document.getElementById('home').classList.add('hide');document.getElementById('detail').classList.remove('hide');document.getElementById('heading').textContent=data[i].name;const p=document.getElementById('phrases'),s=document.getElementById('staff');p.replaceChildren(...data[i].phrases.map(card));s.replaceChildren(...data[i].staff.map(card));document.querySelector('details').open=false;window.scrollTo(0,0)}function goHome(){document.getElementById('detail').classList.add('hide');document.getElementById('home').classList.remove('hide');window.scrollTo(0,0)}const categories=document.getElementById('categories');data.forEach((d,i)=>{let b=document.createElement('button');b.className='category';b.textContent=d.name+'  →';b.onclick=()=>openTopic(i);categories.append(b)});document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim(),r=document.getElementById('results');r.replaceChildren();categories.style.display=q?'none':'';if(!q)return;let found=0;for(const d of data){for(const p of [...d.phrases,...d.staff]){if((d.name+' '+p.join(' ')).toLowerCase().includes(q)){r.append(card(p));found++}}}if(!found)r.textContent='No matches in this small sample yet.'});
</script></body></html>
