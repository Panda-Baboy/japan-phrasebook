</style></head><body><header class="top"><div class="topinner"><h1>🇯🇵 Japan Phrasebook <span style="font-size:13px;font-weight:400">V3.7.1 · Offline Sync</span></h1><p>Tap, learn, and show phrases — made for your Japan trip</p><div id="network" class="status" aria-live="polite">Checking offline readiness…</div></div></header><main class="wrap"><nav class="nav" aria-label="Main navigation"><button data-page="home" class="active">⌂ Home</button><button data-page="favourites">★ Favourites</button><button data-page="flashcards">🧠 Flashcards</button><button data-page="builder">🧩 Sentence Builder</button><button data-page="quick">🆘 Quick Help</button></nav><div id="app"><p>Loading phrasebook…</p></div><div class="footer">Made for offline travel · <a class="footerlink" href="https://github.com/Panda-Baboy/japan-phrasebook">Website source</a><br>Tip: add this website to your Home Screen after testing.</div></main><div id="overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Show Japanese to staff"><button id="closeOverlay" class="btn alt close">✕ Close</button><div id="overlayJa" class="big" lang="ja"></div><div id="overlayKana" class="tiny" lang="ja"></div><div id="overlayRomaji" class="tiny"></div><div id="overlayEn" class="tiny"></div><button id="listenOverlay" class="btn alt">🔊 Listen</button><button id="rotateOverlay" class="btn alt rotate">↻ Fit / rotate hint</button></div>
<script>
'use strict';
const CATS={'Essentials':'🙏','Food & Drinks':'🍵','Shopping':'🛍️','Transport':'🚅','Hotels & Luggage':'🧳','Activities':'🎢','Quick Help':'🆘','Signs & Vocabulary':'🪧','Numbers & Time':'🕒','Clothing & Shoes':'👗','Convenience Stores':'🏪','Restaurants & Omakase':'🍣','Matcha & Cafés':'🍵','Matcha Shopping':'🍃','Tsukiji & Street Food':'🍢','Trading Cards':'🃏','Skincare & Cosmetics':'🧴','Beauty Electronics':'💨','Onsen':'♨️','Universal Studios Japan':'🎢','Shinkansen & Trains':'🚄','Directions & Places':'🗺️'};
let phrases=[],page='home',selectedCategory='',search='',studyCat='Essentials',studyIndex=0,studyRevealed=false,studyDirection='en',studyShowKana=true,studyOrder=[],currentOverlay=null;
const $=s=>document.querySelector(s), app=$('#app');
function safe(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function favs(){try{return JSON.parse(localStorage.getItem('jp_favs_v3')||'[]')}catch{return []}}
function setFavs(v){try{localStorage.setItem('jp_favs_v3',JSON.stringify(v))}catch{alert('This browser could not save favourites. Check storage settings.')}}
function phrase(i){let p=phrases[i];return `<article class="card"><div class="en">${p.type==='staff'?'👂 STAFF MAY SAY · ':''}${safe(p.en)}</div><div class="ja" lang="ja">${safe(p.ja)}</div><div class="kana" lang="ja">${safe(p.kana)}</div><div class="romaji">${safe(p.romaji)}</div><div class="actions"><button class="btn alt" data-speak="${i}">🔊 Listen</button><button class="btn" data-show="${i}">▣ Show to Staff</button><button class="btn alt" data-copy="${i}">Copy</button><button class="btn alt ${favs().includes(i)?'starred':''}" data-fav="${i}">${favs().includes(i)?'★ Saved':'☆ Save'}</button></div></article>`}
function list(ids){return ids.length?`<div class="count">${ids.length} phrases</div><div class="cards">${ids.map(phrase).join('')}</div>`:'<div class="empty">No phrases found. Try a different search.</div>'}
function home(){app.innerHTML=`<h2>What do you need help with?</h2><input id="search" class="search" type="search" placeholder="Search English, Japanese, kana or romaji…" aria-label="Search phrases" value="${safe(search)}"><div id="searchResults"></div><div id="homeCats"><div class="grid">${Object.entries(CATS).map(([name,emoji])=>`<button class="tile" data-cat="${safe(name)}"><span class="emoji">${emoji}</span><strong>${safe(name)}</strong><small>${phrases.filter(p=>p.category===name).length} phrases →</small></button>`).join('')}</div><details><summary>How to use this guide</summary><p class="mini">Tap a category, save favourites with ☆, use Show to Staff for large Japanese, practise in Flashcards, and create phrases in Sentence Builder. The site needs to be opened online once on each device to cache it for offline use.</p></details></div>`;$('#search').addEventListener('input',e=>{search=e.target.value;updateSearch()});updateSearch()}
function vFinalNormalize(v){return String(v??'').normalize('NFKC').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase().replace(/[\s\-‐‑–—_.,!?？。、・]+/g,' ').trim()}
function updateSearch(){
 const q=vFinalNormalize(search),terms=q.split(' ').filter(Boolean);
 const cats=$('#homeCats'),results=$('#searchResults');if(!cats||!results)return;
 cats.classList.toggle('hidden',!!q);
 if(!q){results.innerHTML='';return}
 const matches=phrases.map((p,i)=>({p,i,hay:vFinalNormalize([p.en,p.ja,p.kana,p.romaji,p.category].join(' '))})).filter(x=>terms.every(t=>x.hay.includes(t))).map(x=>x.i);
 results.innerHTML=list(matches);
} 
function category(){let ids=phrases.map((p,i)=>p.category===selectedCategory?i:-1).filter(i=>i>=0);app.innerHTML=`<button class="back" data-back="1">← All categories</button><div class="head"><h2>${CATS[selectedCategory]||'📖'} ${safe(selectedCategory)}</h2></div>${list(ids)}`}
function favourites(){let ids=favs().filter(i=>phrases[i]);app.innerHTML=`<div class="head"><h2>★ My Favourites</h2></div><p class="muted">Saved on this device only; they work offline after caching. Other devices keep their own favourites.</p>${ids.length?list(ids):'<div class="empty">Nothing saved yet. Tap ☆ Save on any phrase.</div>'}`}
function quick(){let ids=phrases.map((p,i)=>p.category==='Quick Help'?i:-1).filter(i=>i>=0);app.innerHTML=`<div class="head"><h2>🆘 Quick Help</h2></div><p class="notice">For emergencies in Japan, call 119 for ambulance/fire or 110 for police. This phrasebook is not an emergency service.</p>${list(ids)}`}
function shuffleDeck(){studyOrder=phrases.map((p,i)=>p.category===studyCat?i:-1).filter(i=>i>=0);for(let i=studyOrder.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[studyOrder[i],studyOrder[j]]=[studyOrder[j],studyOrder[i]]}studyIndex=0;studyRevealed=false}
function flashcards(){if(!studyOrder.length)shuffleDeck();let p=phrases[studyOrder[studyIndex]];let japaneseFront=studyDirection==='ja';let front=japaneseFront?p.ja:p.en;let back=japaneseFront?p.en:p.ja;let kanaLine=(japaneseFront&&!studyRevealed&&studyShowKana)?`<div class="kana" lang="ja" style="font-size:19px;margin-top:14px">${safe(p.kana)}</div>`:'';app.innerHTML=`<div class="head"><h2>🧠 Flashcards</h2></div><p class="muted">Choose a category, tap the card to flip, and practise for five minutes a day.</p><div class="panel"><label for="deck">Category</label><select id="deck">${Object.keys(CATS).map(c=>`<option ${studyCat===c?'selected':''}>${safe(c)}</option>`).join('')}</select><label for="direction">Front of card</label><select id="direction"><option value="en" ${studyDirection==='en'?'selected':''}>English → Japanese</option><option value="ja" ${studyDirection==='ja'?'selected':''}>Japanese → English</option></select><label style="display:flex;align-items:center;gap:9px;margin-top:15px"><input id="showKana" type="checkbox" ${studyShowKana?'checked':''} style="width:19px;height:19px"> Show kana on Japanese side (hide for a challenge)</label><div class="count">Card ${studyIndex+1} of ${studyOrder.length} · Progress stays within this session</div><div id="studyCard" class="study" role="button" tabindex="0" aria-label="Flip flashcard"><div class="prompt" ${japaneseFront&&!studyRevealed?'lang="ja"':''}>${safe(studyRevealed?back:front)}</div>${kanaLine}${studyRevealed?`<div class="answer" lang="ja" style="margin-top:12px">${safe(p.kana)}</div><div class="romaji">${safe(p.romaji)}</div><div class="hint">${safe(p.en)}</div>`:'<div class="hint">Tap to reveal the answer</div>'}</div><div class="studyControls"><button class="btn alt" id="previous">← Previous</button><button class="btn" id="flip">Flip card</button><button class="btn alt" id="next">Next →</button><button class="btn alt" id="reshuffle">Shuffle</button></div><div class="studyControls"><button class="btn alt" data-show="${studyOrder[studyIndex]}">▣ Show to Staff</button><button class="btn alt" data-speak="${studyOrder[studyIndex]}">🔊 Listen</button><button class="btn alt" data-fav="${studyOrder[studyIndex]}">☆ Save</button></div></div>`;$('#deck').onchange=e=>{studyCat=e.target.value;shuffleDeck();flashcards()};$('#direction').onchange=e=>{studyDirection=e.target.value;studyRevealed=false;flashcards()};$('#showKana').onchange=e=>{studyShowKana=e.target.checked;try{localStorage.setItem('jp_flash_kana_v31',studyShowKana?'show':'hide')}catch{}flashcards()};$('#studyCard').onclick=()=>{studyRevealed=!studyRevealed;flashcards()};$('#studyCard').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();studyRevealed=!studyRevealed;flashcards()}};$('#flip').onclick=()=>{studyRevealed=!studyRevealed;flashcards()};$('#previous').onclick=()=>{studyIndex=(studyIndex+studyOrder.length-1)%studyOrder.length;studyRevealed=false;flashcards()};$('#next').onclick=()=>{studyIndex=(studyIndex+1)%studyOrder.length;studyRevealed=false;flashcards()};$('#reshuffle').onclick=()=>{shuffleDeck();flashcards()}}
const objects=[['この商品','この しょうひん','kono shōhin','this product'],['このサイズ','この サイズ','kono saizu','this size'],['抹茶','まっちゃ','matcha','matcha'],['トイレ','トイレ','toire','the toilet'],['コインロッカー','コインロッカー','koin rokkā','coin lockers'],['英語のメニュー','えいごの メニュー','eigo no menyū','an English menu'],['このカード','この カード','kono kādo','this card']];
const patterns=[{name:'Do you have …?',p:'は',tail:'ありますか？',kana:'ありますか？',romaji:'wa arimasu ka?',en:'Do you have {x}?'},{name:'Where is …?',p:'は',tail:'どこですか？',kana:'どこですか？',romaji:'wa doko desu ka?',en:'Where is {x}?'},{name:'Could you show me …?',p:'を',tail:'見せていただけますか？',kana:'みせて いただけますか？',romaji:'o misete itadakemasu ka?',en:'Could you show me {x}?'},{name:'I am looking for …',p:'を',tail:'探しています。',kana:'さがしています。',romaji:'o sagashite imasu.',en:'I am looking for {x}.'}];
let objectIndex=0,patternIndex=0;
function built(){let o=objects[objectIndex],p=patterns[patternIndex];return {ja:o[0]+p.p+p.tail,kana:o[1]+' '+p.p+' '+p.kana,romaji:o[2]+' '+p.romaji,en:p.en.replace('{x}',o[3])}}
function builder(){let b=built();app.innerHTML=`<div class="head"><h2>🧩 Sentence Builder</h2></div><p class="muted">Select an item and a question. The app chooses the particle for these tested patterns.</p><div class="panel"><label for="object">1. Choose an item</label><select id="object">${objects.map((o,i)=>`<option value="${i}" ${i===objectIndex?'selected':''}>${safe(o[3])} · ${safe(o[0])}</option>`).join('')}</select><label for="pattern">2. Choose a sentence pattern</label><select id="pattern">${patterns.map((o,i)=>`<option value="${i}" ${i===patternIndex?'selected':''}>${safe(o.name)}</option>`).join('')}</select><div class="result"><div class="en">${safe(b.en)}</div><div class="ja" lang="ja">${safe(b.ja)}</div><div class="kana" lang="ja">${safe(b.kana)}</div><div class="romaji">${safe(b.romaji)}</div><div class="actions"><button class="btn" id="showBuilt">▣ Show to Staff</button><button class="btn alt" id="listenBuilt">🔊 Listen</button><button class="btn alt" id="copyBuilt">Copy</button><button class="btn alt" id="saveBuilt">☆ Save sentence</button></div></div><details><summary>Why does the particle change?</summary><p class="mini"><b>は (wa)</b> marks the topic in “Do you have …?” and “Where is …?”. <b>を (o)</b> marks the object of actions like “show” and “look for”. These patterns are deliberately limited to combinations we can form reliably.</p></details><p class="mini">Tip: saved custom sentences appear in a separate list below. Custom sentences are stored only on this device.</p><div id="customList"></div></div>`;$('#object').onchange=e=>{objectIndex=+e.target.value;builder()};$('#pattern').onchange=e=>{patternIndex=+e.target.value;builder()};$('#showBuilt').onclick=()=>show(built());$('#copyBuilt').onclick=()=>copy(b.ja);$('#listenBuilt').onclick=()=>v35Speak(b.ja);$('#saveBuilt').onclick=()=>{let all=custom();if(!all.some(x=>x.ja===b.ja)){all.push(b);try{localStorage.setItem('jp_custom_v3',JSON.stringify(all))}catch{alert('Unable to save on this device.')}}renderCustom()};renderCustom()}
function custom(){try{return JSON.parse(localStorage.getItem('jp_custom_v3')||'[]')}catch{return []}}
function renderCustom(){let el=$('#customList');if(!el)return;let all=custom();el.innerHTML=all.length?`<h3>Saved sentences</h3>${all.map((p,i)=>`<div class="card" style="margin-top:9px"><div class="en">${safe(p.en)}</div><div class="ja">${safe(p.ja)}</div><div class="kana">${safe(p.kana)}</div><div class="romaji">${safe(p.romaji)}</div><div class="actions"><button class="btn alt" data-customspeak="${i}">🔊 Listen</button><button class="btn" data-customshow="${i}">Show to Staff</button><button class="btn alt" data-customdelete="${i}">Remove</button></div></div>`).join('')}`:''}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='home')home();if(page==='category')category();if(page==='favourites')favourites();if(page==='quick')quick();if(page==='flashcards')flashcards();if(page==='builder')builder()}
function show(p){currentOverlay=p;$('#overlayJa').textContent=p.ja;$('#overlayKana').textContent=p.kana;$('#overlayRomaji').textContent=p.romaji;$('#overlayEn').textContent=p.en;$('#overlay').classList.remove('hidden');document.body.style.overflow='hidden'}
function closeShow(){$('#overlay').classList.add('hidden');document.body.style.overflow='';$('#overlay').classList.remove('rotated')}
async function copy(t){try{await navigator.clipboard.writeText(t);alert('Japanese copied!')}catch{prompt('Copy this Japanese text:',t)}}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.speak!==undefined){v35Speak(phrases[+b.dataset.speak].ja)}else if(b.dataset.customspeak!==undefined){v35Speak(custom()[+b.dataset.customspeak].ja)}else if(b.dataset.page){page=b.dataset.page;render();scrollTo(0,0)}else if(b.dataset.cat){selectedCategory=b.dataset.cat;page='category';render();scrollTo(0,0)}else if(b.dataset.back){page='home';search='';render()}else if(b.dataset.show!==undefined){show(phrases[+b.dataset.show])}else if(b.dataset.copy!==undefined){copy(phrases[+b.dataset.copy].ja)}else if(b.dataset.fav!==undefined){let i=+b.dataset.fav, f=favs();setFavs(f.includes(i)?f.filter(x=>x!==i):[...f,i]);render()}else if(b.dataset.customshow!==undefined){show(custom()[+b.dataset.customshow])}else if(b.dataset.customdelete!==undefined){let c=custom();c.splice(+b.dataset.customdelete,1);localStorage.setItem('jp_custom_v3',JSON.stringify(c));renderCustom()}});
$('#closeOverlay').onclick=closeShow;$('#listenOverlay').onclick=()=>{if(currentOverlay?.ja)v35Speak(currentOverlay.ja)};$('#rotateOverlay').onclick=()=>{$('#overlay').classList.toggle('rotated')};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeShow()});
function updateStatus(){let el=$('#network');el.textContent=navigator.onLine?'● Online · Offline cache will be checked':'● Offline · Using saved website files';}
